name: dag
description: >
  Transpiles .dag files (plain text with embedded Dart code, PHP-style)
  into plain .dart source files. Not a template engine: the .dag file IS
  Dart code, interleaved with literal text, exactly like a .php file is PHP
  code interleaved with HTML.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  args: ^2.5.0
  watcher: ^1.1.0
  path: ^1.9.0
  build: ^2.4.1

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
  build_runner: ^2.4.9
